<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- terminal window -->
  <rect x="80" y="140" width="1120" height="420" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <circle cx="112" cy="172" r="7" fill="#ff5f57"/>
  <circle cx="136" cy="172" r="7" fill="#febc2e"/>
  <circle cx="160" cy="172" r="7" fill="#28c840"/>

  <!-- title -->
  <text x="80" y="90" font-family="Menlo, monospace" font-size="56" font-weight="bold" fill="#ffffff">ssh-mcp</text>
  <rect x="330" y="52" width="380" height="44" rx="22" fill="#21262d" stroke="url(#accent)" stroke-width="2"/>
  <text x="520" y="82" font-family="Menlo, monospace" font-size="24" fill="#58a6ff" text-anchor="middle">MCP server + CLI</text>

  <!-- terminal content -->
  <g font-family="Menlo, monospace" font-size="26">
    <text x="120" y="240" fill="#8b949e">$</text>
    <text x="150" y="240" fill="#e6edf3">ssh-mcp exec prod-web "uptime"</text>
    <text x="150" y="280" fill="#8b949e">21:42:07 up 34 days,  load average: 0.18 0.22 0.19</text>

    <text x="120" y="350" fill="#8b949e">$</text>
    <text x="150" y="350" fill="#e6edf3">ssh-mcp exec prod-web "npm run build" --bg</text>
    <text x="150" y="390" fill="#3fb950">Job started: job_m9x2k1</text>

    <text x="120" y="460" fill="#8b949e">$</text>
    <text x="150" y="460" fill="#e6edf3">ssh-mcp forward prod-db localhost 5432</text>
    <text x="150" y="500" fill="#3fb950">127.0.0.1:15432 -> localhost:5432  (Ctrl-C to stop)</text>
  </g>

  <!-- feature pills -->
  <g font-family="Menlo, monospace" font-size="22">
    <rect x="80" y="590" width="150" height="34" rx="17" fill="#21262d" stroke="#30363d"/>
    <text x="155" y="613" fill="#8b949e" text-anchor="middle">auto-connect</text>
    <rect x="250" y="590" width="170" height="34" rx="17" fill="#21262d" stroke="#30363d"/>
    <text x="335" y="613" fill="#8b949e" text-anchor="middle">bg jobs</text>
    <rect x="440" y="590" width="150" height="34" rx="17" fill="#21262d" stroke="#30363d"/>
    <text x="515" y="613" fill="#8b949e" text-anchor="middle">SFTP</text>
    <rect x="610" y="590" width="170" height="34" rx="17" fill="#21262d" stroke="#30363d"/>
    <text x="695" y="613" fill="#8b949e" text-anchor="middle">jump hosts</text>
    <rect x="800" y="590" width="190" height="34" rx="17" fill="#21262d" stroke="#30363d"/>
    <text x="895" y="613" fill="#8b949e" text-anchor="middle">self-updating</text>
  </g>
</svg>
