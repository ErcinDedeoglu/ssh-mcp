services:
  ssh-server-1:
    image: linuxserver/openssh-server:latest
    container_name: ssh-mcp-test-1
    hostname: test-server-1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass123
    volumes:
      - ./tests/e2e/config/sshd_config:/etc/ssh/sshd_config:ro
    ports:
      - '2222:2222'
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '2222']
      interval: 5s
      timeout: 3s
      retries: 5

  ssh-server-2:
    image: linuxserver/openssh-server:latest
    container_name: ssh-mcp-test-2
    hostname: test-server-2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=admin
      - USER_PASSWORD=admin456
    volumes:
      - ./tests/e2e/config/sshd_config:/etc/ssh/sshd_config:ro
    ports:
      - '2223:2222'
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '2222']
      interval: 5s
      timeout: 3s
      retries: 5

  ssh-server-key:
    image: linuxserver/openssh-server:latest
    container_name: ssh-mcp-test-key
    hostname: test-server-key
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PASSWORD_ACCESS=false
      - USER_NAME=keyuser
      - PUBLIC_KEY_FILE=/keys/authorized_keys
    volumes:
      - ./tests/e2e/keys:/keys:ro
      - ./tests/e2e/config/sshd_config:/etc/ssh/sshd_config:ro
    ports:
      - '2224:2222'
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '2222']
      interval: 5s
      timeout: 3s
      retries: 5
