# E2E Test Docker Compose
# Supports parallel shards via PORT_BASE environment variable
# Usage: PORT_BASE=3 docker compose -p ssh-mcp-e2e-1 up -d
# Default PORT_BASE=2 gives ports 2222, 2223, 2224

services:
  ssh-server-1:
    image: linuxserver/openssh-server:latest
    hostname: test-server-1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=testuser
      - USER_PASSWORD=testpass123
    volumes:
      - ./tests/e2e/config/sshd_config:/etc/ssh/sshd_config:ro
    ports:
      - '${PORT_BASE:-2}222:2222'
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '2222']
      interval: 5s
      timeout: 3s
      retries: 5

  ssh-server-2:
    image: linuxserver/openssh-server:latest
    hostname: test-server-2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=admin
      - USER_PASSWORD=admin456
    volumes:
      - ./tests/e2e/config/sshd_config:/etc/ssh/sshd_config:ro
    ports:
      - '${PORT_BASE:-2}223:2222'
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '2222']
      interval: 5s
      timeout: 3s
      retries: 5

  ssh-server-key:
    image: linuxserver/openssh-server:latest
    hostname: test-server-key
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PASSWORD_ACCESS=false
      - USER_NAME=keyuser
      - PUBLIC_KEY_FILE=/keys/authorized_keys
    volumes:
      - ./tests/e2e/keys:/keys:ro
      - ./tests/e2e/config/sshd_config:/etc/ssh/sshd_config:ro
    ports:
      - '${PORT_BASE:-2}224:2222'
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '2222']
      interval: 5s
      timeout: 3s
      retries: 5
