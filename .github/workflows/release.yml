name: Release

on:
  push:
    tags: ['v*']

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test

  publish:
    name: Publish to npm (trusted publishing)
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) requires npm >= 11.5
      - run: npm install -g npm@latest
      - run: npm install
      # Tag snapshots carry prebuilt dist/ - build only as a safety net
      - run: npm run build
      - name: Publish (trusted publishing, OIDC)
        env:
          # Ensure no token auth shadows the OIDC handshake
          NODE_AUTH_TOKEN: ''
        run: npm publish --access public
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
